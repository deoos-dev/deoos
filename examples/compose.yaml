x-demo: &demo
  image: deoos-examples:local
  build:
    context: .
    dockerfile: docker/Dockerfile
  profiles: [demo]
  init: true
  depends_on: [rustfs]
  volumes:
    - ./python:/app/python:ro
    - ./typescript:/app/typescript:ro
    - ./tests:/app/tests:ro
    - ./outputs:/app/outputs

services:
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      RUSTFS_ACCESS_KEY: local-development
      RUSTFS_SECRET_KEY: local-development-only-secret
    volumes:
      - rustfs-data:/data
  hacker-news:
    <<: *demo
    entrypoint: [deoos-demo, hacker-news]
  devto-etl:
    <<: *demo
    entrypoint: [deoos-demo, devto-etl]
  payment-resume:
    <<: *demo
    entrypoint: [deoos-demo, payment-resume]
  document-index:
    <<: *demo
    entrypoint: [deoos-demo, document-index]
  counting-house:
    <<: *demo
    entrypoint: [deoos-demo, counting-house]
  nightly-batch-resume:
    <<: *demo
    entrypoint: [deoos-demo, nightly-batch-resume]
  agent-run-resume:
    <<: *demo
    entrypoint: [deoos-demo, agent-run-resume]
  worker-amd64:
    <<: *demo
    platform: linux/amd64
    image: deoos-examples:amd64
    entrypoint: [deoos-demo, multi-arch-handoff]
  worker-arm64:
    <<: *demo
    platform: linux/arm64
    image: deoos-examples:arm64
    entrypoint: [deoos-demo, multi-arch-handoff]
  # Started by the multi-arch test after the amd64 image exists. Not part of
  # `docker compose up -d`, which starts only RustFS.
  deoos-server:
    image: deoos-examples:amd64
    platform: linux/amd64
    pull_policy: never
    profiles: [server]
    init: true
    depends_on: [rustfs]
    entrypoint: ["/opt/deoos/bin/deoos-server"]
    environment:
      DEOOS_STORAGE_PROVIDER: s3
      DEOOS_STORAGE_BUCKET: ${DEOOS_STORAGE_BUCKET:-unset}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: local-development
      AWS_SECRET_ACCESS_KEY: local-development-only-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      EXECUTION_PREFIX: ${EXECUTION_PREFIX:-handoff}
      LEASE_MS: ${LEASE_MS:-20000}
      ENGINE_BIND: 0.0.0.0:7331
      ENGINE_TOKEN: ${ENGINE_TOKEN:-unset}
    ports:
      - "127.0.0.1:7331:7331"

volumes:
  rustfs-data:
