name: Examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Install pinned deoos release
        run: ./scripts/install_deoos.sh
      - name: Set up QEMU for the arm64 handoff
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: Start RustFS
        run: docker compose up -d rustfs
      - name: Wait for RustFS
        run: |
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:19000/health', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('RustFS did not become ready')
          PY
      - name: Every example against RustFS and deoos-server
        run: ./scripts/test.sh
      - name: Counting House via the documented Docker command
        run: docker compose run --build --rm counting-house
      - name: Capture RustFS logs
        if: always()
        run: |
          mkdir -p outputs/evidence
          docker compose logs --no-color > outputs/evidence/rustfs.log 2>&1 || true
          docker compose down -v || true
          # The Docker demo runs as root and writes private case files.
          sudo chmod -R a+rX outputs || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: examples-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 14
