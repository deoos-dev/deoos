      RUSTFS_ACCESS_KEY: local-development
      RUSTFS_SECRET_KEY: local-development-only-secret
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true" # CI only: Docker volumes share host disks
      RUSTFS_VOLUMES: "http://node{1...4}:9000/data{1...4}"
    ports:
      - "127.0.0.1:19102:9000"
    volumes:
      - node2-disk1:/data1
      - node2-disk2:/data2
      - node2-disk3:/data3
      - node2-disk4:/data4
  node3:
