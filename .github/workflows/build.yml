name: Build and test

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Leave running tests time to clean their own S3 buckets.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.93.1'
  NODE_VERSION: '22.23.2'
  CARGO_BUILD_JOBS: '4'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust formatting and lint
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --no-self-update
          cargo +"$RUST_VERSION" fmt --manifest-path engine/Cargo.toml --check
          cargo +"$RUST_VERSION" fmt --manifest-path bindings/node/Cargo.toml --check
          cargo +"$RUST_VERSION" clippy --locked --manifest-path engine/Cargo.toml -- -D warnings
          cargo +"$RUST_VERSION" clippy --locked --manifest-path bindings/node/Cargo.toml -- -D warnings
      - name: TypeScript and Python syntax
        run: |
          npm ci --prefix clients/typescript
          npm run build --prefix clients/typescript
          python -m compileall -q clients/python packaging tests examples
      - name: Build native artifacts for behavioral tests
        timeout-minutes: 30
        run: |
          python -m pip install -r tests/requirements.txt
          rustup override set "$RUST_VERSION"
          python packaging/build_package.py --build-only
      - name: Run both SDKs and deployment modes against RustFS
        timeout-minutes: 15
        env:
          ENGINE_BINARY: ${{ github.workspace }}/engine/target/release/deoos-engine
        run: |
          docker compose up -d
          python - <<'PYTHON'
          import time, boto3
          s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:19000',
                            region_name='us-east-1', aws_access_key_id='local-development',
                            aws_secret_access_key='local-development-only-secret')
          for attempt in range(60):
              try:
                  s3.list_buckets()
                  break
              except Exception:
                  time.sleep(.5)
          else:
              raise RuntimeError('RustFS did not become ready')
          PYTHON
          python tests/two_modes.py rustfs
      - name: Capture RustFS logs and remove its volume
        if: always()
        run: |
          mkdir -p ../outputs/evidence
          docker compose logs --no-color > ../outputs/evidence/rustfs.log 2>&1
          docker compose down -v
      - name: Upload behavioral evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/../outputs/evidence/
          if-no-files-found: ignore
          retention-days: 14

  packages:
    needs: checks
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            cpu: arm64
          - target: macos-x64
            runner: macos-15-intel
            cpu: x64
          - target: linux-x64
            runner: ubuntu-24.04
            cpu: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cpu: arm64
          - target: windows-x64
            runner: windows-2022
            cpu: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      DEOOS_EXPECTED_AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      DEOOS_TEST_BUCKET_PREFIX: deoos-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.cpu }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.cpu }}
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Build Linux packages in audited glibc 2.28 images
        if: startsWith(matrix.target, 'linux-')
        timeout-minutes: 40
        run: python packaging/ci.py linux-build "${{ matrix.target }}"
      - name: Build native macOS and Windows packages
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        timeout-minutes: 40
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup override set "$RUST_VERSION"
          python packaging/build_package.py
          python packaging/ci.py verify "${{ matrix.target }}"
      - name: Validate required AWS account configuration
        run: python packaging/ci.py account-config
      - name: Obtain short-lived credentials for the configured test account
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deoos-${{ github.run_id }}-${{ strategy.job-index }}
          role-duration-seconds: 3600
      - name: Verify AWS account
        run: python packaging/ci.py identity
      - name: Test installed Linux packages against S3
        if: startsWith(matrix.target, 'linux-')
        timeout-minutes: 15
        run: python packaging/ci.py linux-test "${{ matrix.target }}"
      - name: Test installed macOS and Windows packages against S3
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        timeout-minutes: 15
        run: python tests/package_smoke.py --backend aws --aws-profile auto
      - name: Clean exact test buckets and temporary container
        if: always()
        timeout-minutes: 10
        run: python packaging/ci.py cleanup
      - name: Upload tested packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deoos-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/../outputs/deoos-*/
            ${{ github.workspace }}/../outputs/deoos-*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload runtime and ABI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/../outputs/evidence/
          if-no-files-found: ignore
          retention-days: 14
